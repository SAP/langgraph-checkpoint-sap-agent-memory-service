name: Conformance Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'langgraph/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance Tests
    runs-on: ${{ contains(github.server_url, 'github.com') && 'ubuntu-latest' || fromJSON('["self-hosted"]') }}
    environment: conformance-test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"

      - name: Run conformance tests
        run: uv run pytest tests/test_conformance.py -v -s
        env:
          AGENT_MEMORY_BASE_URL: ${{ vars.AGENT_MEMORY_BASE_URL }}
          AGENT_MEMORY_TOKEN_URL: ${{ vars.AGENT_MEMORY_TOKEN_URL }}
          AGENT_MEMORY_CLIENT_ID: ${{ secrets.AGENT_MEMORY_CLIENT_ID }}
          AGENT_MEMORY_CLIENT_SECRET: ${{ secrets.AGENT_MEMORY_CLIENT_SECRET }}
